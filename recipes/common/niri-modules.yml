modules:
    - type: rpm-ostree
      install:
        - niri
        - waybar
        - xdg-desktop-portal-wlr
        - xdg-desktop-portal-gtk
        - alacritty
        - fuzzel
        - swaylock
        - swayidle
        - swaybg
        - code
        - containerd.io
        - docker-buildx-plugin
        - docker-ce
        - docker-ce-cli
        - docker-compose-plugin
        - freeipa-client
        - neovim
        - podman-compose

    - type: files
      files:
        - source: system/niri
          destination: /

    - type: script
      scripts:
        - setniriwaybarmodules.sh
